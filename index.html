<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Nice Dice</title>
    <meta name="description" content="Nice Dice, a dicewright's idle game: carve dice from pine to obsidian, roll them on the bench for points, refine them, chase poker hands and press your luck." />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" />
    <!-- Relative hrefs (no leading slash) so the site works under /<repo>/ on GitHub Pages. The browser resolves them against the page URL. -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Theme before first paint: settings theme if set, else the OS preference. Mirrors src/app/theme.ts.
      try {
        var s = JSON.parse(localStorage.getItem('nice-dice:settings') || '{}');
        var t = s && s.theme;
        var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
        if (s && s.reduceMotion) document.documentElement.classList.add('reduce-motion');
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
